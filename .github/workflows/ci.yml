# Restore the verified release baseline; test SQL semantics and both application runtimes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (test + vet + validate-stmts)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The schema.sql DB the queue tests + validate-stmts run against.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scoracle_test?sslmode=disable
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The schema dump uses psql 18 directives (\restrict/\unrestrict) and a
      # pg18-era dump format, so install a matching client rather than relying on
      # the runner's bundled psql.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - uses: dtolnay/rust-toolchain@stable

      - name: Runtime and database contracts (same entry point as local checks)
        run: |
          createdb -h localhost -U postgres scoracle_test
          ./scripts/check.sh "$TEST_DATABASE_URL"

  shell:
    name: Shell (syntax + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; fail=1; }
          done < <(find scripts sql -name '*.sh')
          exit "$fail"

      # warning+ severity catches real bugs; -x follows sourced .env files so
      # optional-source lines don't trip SC1091. Info/style nits are not failures.
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x --severity=warning $(find scripts sql -name '*.sh' | sort)

  schema:
    name: Schema (static migration/snapshot check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify baseline checksums and applied lineage
        run: |
          (cd sql/schema && sha256sum -c SHA256SUMS)
          expected="$(mktemp)"
          for f in sql/migrations/*.sql; do basename "$f" .sql; done | sort > "$expected"
          # PostgreSQL's ledger collation and the runner's shell locale order
          # 042a_* and 042_* differently; compare the captured set, not order.
          diff -u <(LC_ALL=C sort "$expected") \
                  <(LC_ALL=C sort sql/schema/applied-migrations.txt)
          # Never regenerate applied history from filenames. Capture a verified database.
