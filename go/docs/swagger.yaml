        enum:
        - nba
        - nfl
        - football
        in: path
        name: sport
        required: true
        type: string
      - description: 'Board type: player (default) or team'
        in: query
        name: entity_type
        type: string
      - description: 'Board: composite (default), sigil, or a sigil label (e.g. Sacks)'
        in: query
        name: scope
        type: string
      - description: Season year (defaults to the latest rated season)
        in: query
        name: season
        type: integer
      - description: Filter to a position (player boards only)
        in: query
        name: position
        type: string
      - description: Filter to a league (football)
        in: query
        name: league_id
        type: integer
      - description: Max rows (default 50)
        in: query
        name: limit
        type: integer
