  /{sport}/twitter/{entityType}/{id}:
    get:
      description: Returns cached tweets mentioning the given player or team. Matching
        uses the shared search_aliases logic.
      parameters:
      - description: Sport
        enum:
        - nba
        - nfl
        - football
        in: path
        name: sport
        required: true
        type: string
      - description: Entity type
        enum:
        - player
        - team
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Max tweets (1-100, default 25)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
