      parameters:
      - description: Sport
        enum:
        - nba
        - nfl
        - football
        in: path
        name: sport
        required: true
        type: string
      - description: 'Board type: player (default) or team'
        in: query
        name: entity_type
        type: string
      - description: 'Board: rating (default), vibes, sigil, news, transfers, momentum
          (trending legacy alias)'
        in: query
        name: board
        type: string
      - description: 'Rating scope: composite (default), specialist, fantasy, or a
          specialist label (e.g. Sacks)'
        in: query
        name: scope
        type: string
      - description: Season year (defaults to the latest rated season)
        in: query
        name: season
        type: integer
      - description: Filter to a position (player boards only)
        in: query
        name: position
        type: string
      - description: Filter to a normalized position group (player boards only)
        in: query
        name: position_group
        type: string
      - description: Filter to a league (football)
        in: query
        name: league_id
        type: integer
      - description: Filter to a conference
        in: query
        name: conference
        type: string
      - description: Filter to a division
        in: query
        name: division
        type: string
      - description: Filter to a team; with entity_type=player this returns the active
          roster plus product rows
        in: query
        name: team_id
        type: integer
      - description: Max rows (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
