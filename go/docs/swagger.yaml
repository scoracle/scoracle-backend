  /news/{entityType}/{entityID}:
    get:
      description: Returns news articles about a player or team from Google News RSS.
        Supports time-window escalation and strict name matching.
      parameters:
      - description: Entity type
        enum:
        - player
        - team
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity ID
        in: path
        name: entityID
        required: true
        type: integer
      - description: Sport identifier
        enum:
        - NBA
        - NFL
        - FOOTBALL
        in: query
        name: sport
        required: true
        type: string
      - description: Team name for player context
        in: query
        name: team
        type: string
      - description: Max articles (1-50, default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_albapepper_scoracle-data_internal_api_respond.ErrorResponse'
        "404":
