basePath: /api/v1
definitions:
  respond.ErrorResponse:
    properties:
      error:
        properties:
          code:
            type: string
          detail:
            type: string
          message:
            type: string
        type: object
    type: object
host: localhost:8000
info:
  contact:
    name: Scoracle
  description: Unified Scoracle API serving sport data pages, derived products (narratives,
    transfer heat, Vibe, Sigil — precomputed by the Rust cognition layer), health
    checks, and operational endpoints.
  license:
    name: MIT
  title: Scoracle Data API
  version: 2.0.0
paths:
  /:
    get:
      description: Returns API name, version, status, and available optimizations.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: API root info
      tags:
      - meta
  /{sport}/{entityType}/{id}/meta:
    get:
      description: 'The entity''s identity for the page header: name, image, physicals,
        current team/club, position, tier.'
      parameters:
      - description: Sport
        enum:
        - nba
        - nfl
        - football
        in: path
        name: sport
        required: true
        type: string
      - description: Entity type
        enum:
        - player
        - team
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Get per-entity identity metadata
      tags:
      - data
  /{sport}/{entityType}/{id}/momentum:
    get:
      description: Returns the entity's last-3 event averages and peer-cohort season
        averages so the frontend can derive recent direction relative to peers. Raw
        values only.
      parameters:
      - description: Sport
        enum:
        - nba
        - nfl
        - football
        in: path
        name: sport
        required: true
        type: string
      - description: Entity type
        enum:
        - player
        - team
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity ID
        in: path
        name: id
        required: true
        type: integer
      - description: Season year
        in: query
        name: season
        type: integer
      - description: League ID filter
        in: query
        name: league_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/respond.ErrorResponse'
      summary: Get momentum (rating + vibe trajectory)
      tags:
      - data
