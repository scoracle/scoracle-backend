  /{sport}/leaderboard:
    get:
      description: Positionless rating board (z-score engine). entity_type=player
        (default) or team. Composite + Specialist in one payload.
      parameters:
      - description: Sport
        enum:
        - nba
        - nfl
        - football
        in: path
        name: sport
        required: true
        type: string
      - description: 'Board type: player (default) or team'
        in: query
        name: entity_type
        type: string
      - description: 'Board: composite (default), specialist, or a specialty label
          (e.g. Sacks)'
        in: query
        name: scope
        type: string
      - description: Season year (defaults to the latest rated season)
        in: query
        name: season
        type: integer
      - description: Filter to a position (player boards only)
        in: query
        name: position
        type: string
      - description: Filter to a league (football)
        in: query
        name: league_id
        type: integer
      - description: Max rows (default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_albapepper_scoracle-data_internal_api_respond.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_albapepper_scoracle-data_internal_api_respond.ErrorResponse'
      summary: Get rating leaderboard
      tags:
      - data
