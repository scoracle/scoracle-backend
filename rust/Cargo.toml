[package]
name = "scoracle-cognition"
version = "0.0.0"
edition = "2021"
publish = false
autobins = false
description = "Scoracle Cognition Harness: durable pipeline_work queue consumer + Ollama model router — the Rust LLM-derivation (cognition) layer. Capability library + per-stage handlers."

[lib]
name = "scoracle_cognition"
path = "src/lib.rs"

[[bin]]
name = "scoracle-cognition"
path = "src/main.rs"

# Offline A/B model eval harness; read-only on the pipeline.
# Never auto-promotes — a human edits COGNITION_ROUTE_*.
[[bin]]
name = "eval"
path = "src/bin/eval.rs"

# Rating batch: single, nightly, and backfill modes over the rating core.
# Not a pipeline_work stage.
[[bin]]
name = "statcommentary"
path = "src/bin/statcommentary.rs"

# Nightly dynamic-metadata sweep: adjudicates person affiliations from news
# evidence, policy-gated, fail-closed.
[[bin]]
name = "factsweep"
path = "src/bin/factsweep.rs"

[dependencies]
# Async runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Postgres pool + LISTEN/NOTIFY. Runtime query API only (no `query!` macros), so a
# build needs no live DATABASE_URL; DB is localhost sslmode=disable, so no TLS feature.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

# Ollama + article fetch HTTP. native-tls: publisher URLs are HTTPS and it is
# already in the lockfile.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# FuturesUnordered: the drain keeps N items in flight inside ONE task (never spawned,
# so stage futures need no 'static/Send bound).
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

# Deterministic provenance hash (sigil input_hash): sha256 + hex.
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
