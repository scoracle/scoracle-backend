[package]
name = "scoracle-cognition"
version = "0.0.0"
edition = "2021"
publish = false
autobins = false
description = "Scoracle Cognition Harness: durable pipeline_work queue consumer + Ollama model router — the Rust LLM-derivation (cognition) layer. Capability library + per-stage handlers."

[lib]
name = "scoracle_cognition"
path = "src/lib.rs"

[[bin]]
name = "scoracle-cognition"
path = "src/main.rs"

# Offline A/B model eval harness (L2). Scores the role's incumbent vs candidate against
# human labels; read-only on the pipeline. Never auto-promotes — a human edits COGNITION_ROUTE_*.
[[bin]]
name = "eval"
path = "src/bin/eval.rs"

# Step-3 rating batch. Rust replacement for go/cmd/statcommentary: single,
# nightly, and backfill modes over the L12 rating core. Not a pipeline_work stage.
[[bin]]
name = "statcommentary"
path = "src/bin/statcommentary.rs"

# One-shot overnight GPU labeling batch for the F2 bucket classifier (friction-prune
# plan). Read-only on the pipeline; writes ONLY its output TSV. Resumable/idempotent —
# a completed run no-ops, so it is safe on a cron line.
[[bin]]
name = "bucketlabel"
path = "src/bin/bucketlabel.rs"

# One-shot storyline backfill over the shadow period's editor_reads (PLAN-one-rail 6.2). Pure
# code — zero model calls, zero packets, so mig 206's fan-out cannot fire from it. Dry-run
# (rehearse-and-rollback) by default; -apply commits in batches.
[[bin]]
name = "storylinefill"
path = "src/bin/storylinefill.rs"

[dependencies]
# Async runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Postgres — pool + LISTEN/NOTIFY (PgListener). We use the runtime query API
# (sqlx::query / query_as), NOT the compile-time `query!` macros, so a build
# needs no live DATABASE_URL. The DB is localhost with sslmode=disable, so no
# TLS feature is selected. CONFIRM ON FIRST `cargo build`: if your sqlx version
# rejects this feature set, the runtime/TLS feature names are the usual culprit
# (e.g. add "tls-rustls" if you ever connect over TLS).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

# Ollama + article fetch HTTP. Article Reader resolves publisher HTTPS URLs; native-tls is already
# present in the lockfile, so this keeps the fetcher leaner than pulling an extra TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# FuturesUnordered — the worker's concurrent drain keeps N claimed items in flight inside the
# ONE drain task (never spawned, so stage futures still don't cross a task boundary and need no
# 'static/Send bound). Already in the lockfile via sqlx, so this is a direct-dep declaration
# rather than a new download.
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

# Deterministic provenance hash (sigil input_hash) — mirrors Go's crypto/sha256 +
# encoding/hex (rating.go::hashComponents). Leaf utilities, not harness infrastructure.
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# (The candle CPU-embedding layer — candle-core/nn/transformers, hf-hub, tokenizers —
# left with the embed primitive: the legacy rail's relevance/novelty gates were its only
# consumers, and the packet corpus loader reads compiled claims, not vectors.)
