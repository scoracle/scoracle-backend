[package]
name = "scoracle-cognition"
version = "0.0.0"
edition = "2021"
publish = false
description = "Scoracle Cognition Harness: durable pipeline_work queue consumer + Ollama model router — the Rust LLM-derivation (cognition) layer. Capability library + per-stage handlers."

[lib]
name = "scoracle_cognition"
path = "src/lib.rs"

[[bin]]
name = "scoracle-cognition"
path = "src/main.rs"

# Offline vibe parity harness (Phase 1). Writes ONLY vibe_scores_shadow; never claims
# the live pipeline_work queue or writes vibe_scores.
[[bin]]
name = "parity"
path = "src/bin/parity.rs"

# Offline A/B model eval harness (L2). Scores the role's incumbent vs candidate against
# human labels; read-only on the pipeline. Never auto-promotes — a human edits COGNITION_ROUTE_*.
[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[dependencies]
# Async runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Postgres — pool + LISTEN/NOTIFY (PgListener). We use the runtime query API
# (sqlx::query / query_as), NOT the compile-time `query!` macros, so a build
# needs no live DATABASE_URL. The DB is localhost with sslmode=disable, so no
# TLS feature is selected. CONFIRM ON FIRST `cargo build`: if your sqlx version
# rejects this feature set, the runtime/TLS feature names are the usual culprit
# (e.g. add "tls-rustls" if you ever connect over TLS).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

# Ollama HTTP. http://localhost only, so no TLS backend pulled in.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
