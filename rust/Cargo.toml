[package]
name = "scoracle-cognition"
version = "0.0.0"
edition = "2021"
publish = false
description = "Scoracle Cognition Harness: durable pipeline_work queue consumer + Ollama model router — the Rust LLM-derivation (cognition) layer. Capability library + per-stage handlers."

[lib]
name = "scoracle_cognition"
path = "src/lib.rs"

[[bin]]
name = "scoracle-cognition"
path = "src/main.rs"

# Offline vibe parity harness (Phase 1). Writes ONLY vibe_scores_shadow; never claims
# the live pipeline_work queue or writes vibe_scores.
[[bin]]
name = "parity"
path = "src/bin/parity.rs"

# Offline A/B model eval harness (L2). Scores the role's incumbent vs candidate against
# human labels; read-only on the pipeline. Never auto-promotes — a human edits COGNITION_ROUTE_*.
[[bin]]
name = "eval"
path = "src/bin/eval.rs"

# Offline sigil parity harness (L3). Writes ONLY sigil_synthesis_shadow; never claims the
# live pipeline_work queue or writes sigil_synthesis. Twin of bin/parity.rs (vibe).
[[bin]]
name = "sigil_parity"
path = "src/bin/sigil_parity.rs"

# Offline Resolve experiment (L4 — the candle de-risk). Embeds article↔candidate identity for
# Gemma's labeled scrub verdicts (news_article_entities.vetted) and measures whether cosine
# separates genuine links from same-name false-positives. READ-ONLY on the pipeline: SELECTs
# the labeled set, writes a report + CSV to scratchpad, never the queue or product tables.
[[bin]]
name = "resolve_experiment"
path = "src/bin/resolve_experiment.rs"

# Offline Resolve EVAL (L4). Runs the REAL hybrid resolve_set gate end-to-end over a sample of
# labeled articles and reports agreement vs Gemma's vetted labels + the live auto-decide/Gemma
# split (the GPU savings in situ). Needs Ollama up (the ambiguous band). READ-ONLY on the pipeline.
[[bin]]
name = "resolve_eval"
path = "src/bin/resolve_eval.rs"

# Offline Resolve SHADOW (L5). Runs the REAL hybrid resolve_set over the WHOLE labeled
# secondary-link corpus, records every verdict beside Gemma's vetted in resolve_shadow (mig 108),
# and reports auto-decide safety at scale (auto-keep precision + the auto-drop FN rate, sliced by
# recent-mover) + bounded real-gate agreement. READ-ONLY on the pipeline (writes only resolve_shadow).
[[bin]]
name = "resolve_shadow"
path = "src/bin/resolve_shadow.rs"

[dependencies]
# Async runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

# Postgres — pool + LISTEN/NOTIFY (PgListener). We use the runtime query API
# (sqlx::query / query_as), NOT the compile-time `query!` macros, so a build
# needs no live DATABASE_URL. The DB is localhost with sslmode=disable, so no
# TLS feature is selected. CONFIRM ON FIRST `cargo build`: if your sqlx version
# rejects this feature set, the runtime/TLS feature names are the usual culprit
# (e.g. add "tls-rustls" if you ever connect over TLS).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

# Ollama HTTP. http://localhost only, so no TLS backend pulled in.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"

# Deterministic provenance hash (sigil input_hash) — mirrors Go's crypto/sha256 +
# encoding/hex (rating.go::hashComponents). Leaf utilities, not harness infrastructure.
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- Cognition candle layer (L4): CPU sentence-embeddings, OFF the GPU ---
# candle is Rust-native ML; we use the CPU backend (gemm → AVX2+FMA on Archbox's
# i7-7700; NO cuda feature) so embeddings run on the otherwise-idle CPU and never
# contend with Gemma's GTX 1070 Ti. Powers the Embed primitive (§1.4) + the
# embedding-backed Resolve hybrid (§1.3). Default embedding model: BGE-small-en-v1.5
# (BERT-arch → candle-transformers' BertModel).
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
# hf-hub downloads + caches model weights (safetensors) + tokenizer.json to
# ~/.cache/huggingface. tokenizers pinned to 0.22 to MATCH candle-transformers'
# transitive dep (one copy in the tree); no default features → no onig C-lib, which
# the BERT WordPiece tokenizer does not need.
hf-hub = "0.5"
tokenizers = { version = "0.22", default-features = false }
